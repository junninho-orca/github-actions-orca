############################################################
# Repo-level Atlantis config with an Orca IaC gate.
#
# WHERE THIS FILE GOES
#   Atlantis only reads `atlantis.yaml` from the REPO ROOT. Copy this there.
#   The `dir:` values below assume the terragrunt tree also sits at the repo
#   root. In this example repo it lives under examples/atlantis-terragrunt/, so
#   if you point Atlantis straight at this repo, prefix each `dir:` with
#   `examples/atlantis-terragrunt/`.
#
# READ THIS BEFORE USING IT AS A GATE
#   Two things have to be true for the Orca step to actually block anything.
#
#   1. The server must run with --enable-policy-checks
#      (ATLANTIS_ENABLE_POLICY_CHECKS=true). Without it the policy_check phase
#      below never runs and nothing is gated.
#   2. The workflow must be defined server-side, not here. A workflow defined
#      in the repo can be edited by anyone who can open a pull request —
#      including deleting the Orca step or echoing $ORCA_SECURITY_API_TOKEN
#      into a comment. See server-config/repos.yaml, which sets
#      allow_custom_workflows: false.
#
#   This file is the readable reference and a quick demo. server-config/ is
#   what you enforce with.
############################################################

version: 3

# Plans run concurrently; applies are serialised so two units can't race on
# shared state.
parallel_plan: true
parallel_apply: false

# Note for anyone turning this on: with automerge enabled, Atlantis deletes
# pending plan files when any project in the PR errors. That is a side effect
# worth knowing about, but do not treat it as the security control — see the
# comment above the policy_check phase for why the gate lives there.
automerge: false

projects:
  # `apply_requirements` below does not list `policies_passed`. It does not need
  # to: with --enable-policy-checks the server appends it to every project, and
  # it is non-overridable — the config loader re-adds it even when a repo
  # supplies its own apply_requirements. Listing it here would be harmless but
  # misleading, since it would imply a repo could drop it.

  # ---- dev: control case, should pass the gate -----------------------------
  - name: dev-s3-data
    dir: live/dev/s3-data
    workflow: terragrunt-orca
    autoplan:
      enabled: true
      when_modified:
        - "*.hcl"
        - "../env.hcl"
        - "../../account.hcl"
        - "../../../terragrunt.hcl"
        - "../../../modules/s3-bucket/**/*.tf"
    apply_requirements: [approved, mergeable]

  # ---- prod: should fail the gate ------------------------------------------
  - name: prod-s3-data
    dir: live/prod/s3-data
    workflow: terragrunt-orca
    autoplan:
      enabled: true
      when_modified:
        - "*.hcl"
        - "../env.hcl"
        - "../../account.hcl"
        - "../../../terragrunt.hcl"
        - "../../../modules/s3-bucket/**/*.tf"
    apply_requirements: [approved, mergeable]

  - name: prod-rds
    dir: live/prod/rds
    workflow: terragrunt-orca
    autoplan:
      enabled: true
      when_modified:
        - "*.hcl"
        - "../env.hcl"
        - "../../account.hcl"
        - "../../../terragrunt.hcl"
        - "../../../modules/rds/**/*.tf"
    apply_requirements: [approved, mergeable]

workflows:
  terragrunt-orca:
    plan:
      steps:
        # Point Terragrunt at the Terraform binary Atlantis resolved for this
        # project, rather than whatever is first on PATH.
        - env:
            name: TG_TF_PATH
            command: 'echo "${ATLANTIS_TERRAFORM_DISTRIBUTION}${ATLANTIS_TERRAFORM_VERSION}"'
        - env:
            name: TF_IN_AUTOMATION
            value: "true"

        - run:
            command: terragrunt init -input=false

        - run:
            command: terragrunt plan -input=false -out=$PLANFILE
            output: strip_refreshing

    # ----------------------------------------------------------------------
    # The Orca gate lives in policy_check, NOT in plan.
    #
    # This is load-bearing, not stylistic. A `run` step appended to `plan`
    # does not gate anything: `terragrunt plan` has already written $PLANFILE
    # by the time the scan runs, and Atlantis discovers applyable plans by
    # scanning the workspace for untracked *.tfplan files
    # (DefaultPendingPlanFinder) with no check that the plan workflow
    # succeeded. Plans are only deleted on failure when automerge is enabled.
    # So a failed scan in the plan phase leaves an applyable plan file behind,
    # and a bare `atlantis apply` comment will happily apply it.
    #
    # policy_check is the phase Atlantis built for this. When the server runs
    # with --enable-policy-checks, `policies_passed` is appended to every
    # project's apply requirements, and it is in NonOverridableApplyReqs — the
    # config loader re-adds it even when a repo overrides apply_requirements.
    # That is a gate a pull request cannot remove.
    #
    # This also matters more in Atlantis than in a merge-gated CI system:
    # `atlantis apply` runs BEFORE the PR merges, so branch protection is too
    # late to be the control.
    #
    # The default policy_check stage is [show, policy_check]. Both are replaced
    # here: the built-in `show` runs `terraform show`, which needs an
    # initialised working directory, and under Terragrunt that lives in
    # .terragrunt-cache rather than the project dir. `terragrunt show` handles
    # it. This phase only runs after a successful plan, so the init from that
    # phase is already in place.
    # ----------------------------------------------------------------------
    policy_check:
      steps:
        - env:
            name: TG_TF_PATH
            command: 'echo "${ATLANTIS_TERRAFORM_DISTRIBUTION}${ATLANTIS_TERRAFORM_VERSION}"'
        - env:
            name: TF_IN_AUTOMATION
            value: "true"
        # Which Orca AppSec project these findings are filed under. The API
        # token is deliberately NOT set here — see the note at the top of this
        # file. It comes from the Atlantis server's environment.
        - env:
            name: ORCA_PROJECT_KEY
            value: "demo-atlantis-terragrunt"

        # Scans the RENDERED PLAN, not the .hcl or .tf files. A terragrunt.hcl
        # contains no resources — it names a module and a set of inputs — so
        # scanning source files would miss the interesting misconfigs entirely.
        # `terragrunt show -json` produces the merged, fully-resolved resource
        # set, which Orca reads as a first-class IaC platform.
        #
        # The plan JSON can contain secrets in plaintext (Terraform writes
        # sensitive input values into it) and Atlantis workspaces persist
        # between runs, so it is removed via a trap — which fires on the
        # failure path too. A separate cleanup step would not run when the scan
        # exits non-zero.
        #
        # orca-cli exits 3 when the policy decision is "fail", which fails this
        # phase, which fails `policies_passed`, which blocks apply. A scanner
        # error (bad token, network) also exits non-zero under `set -e`, so the
        # gate fails closed rather than waving changes through.
        - run:
            shell: bash
            shellArgs: ["-c"]
            command: |
              set -euo pipefail
              trap 'rm -f orca-plan.json' EXIT

              terragrunt show -json "$PLANFILE" > orca-plan.json

              orca-cli \
                --project-key "$ORCA_PROJECT_KEY" \
                --display-name "atlantis/${PROJECT_NAME}@${HEAD_COMMIT}" \
                iac scan \
                --path orca-plan.json

    apply:
      steps:
        - env:
            name: TG_TF_PATH
            command: 'echo "${ATLANTIS_TERRAFORM_DISTRIBUTION}${ATLANTIS_TERRAFORM_VERSION}"'
        - env:
            name: TF_IN_AUTOMATION
            value: "true"
        # No scan here. policy_check already gated it, and apply consumes the
        # plan file that phase validated. Re-scanning would only add latency.
        - run:
            command: terragrunt apply $PLANFILE
