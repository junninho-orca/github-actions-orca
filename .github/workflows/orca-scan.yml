name: Orca Security Shift-Left

# Shift-left security scans for every PR and every push to main.
# Covers: SAST, SCA, IaC, Secrets, and the built container image.
#
# Gating model:
#   The "fail on High/Critical" gate is enforced by Orca's server-side policy,
#   not by ad-hoc CLI flags. Configure your project policy in Orca to fail on
#   High+Critical. The dedicated actions and the CLI exit with code 3 when a
#   policy decision is "fail", which naturally fails the job.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel older runs of the same ref to keep PR feedback snappy.
concurrency:
  group: orca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed so we can upload SARIF to GitHub code scanning.
  security-events: write
  # Needed so the PR gets a check annotation with findings.
  pull-requests: read
  # Needed by CodeQL upload-sarif to read workflow run metadata.
  actions: read

env:
  # Project key correlates this repo to an Orca AppSec project. Create it in
  # the Orca platform (AppSec -> Management -> Projects). Safe to commit; it
  # is not a secret on its own.
  ORCA_PROJECT_KEY: demo-shiftleft-project
  IMAGE_NAME: orca-demo-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # -------------------------------------------------------------------
  # SAST: static analysis of source code.
  # -------------------------------------------------------------------
  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Orca SAST scan
        uses: orcasecurity/shiftleft-sast-action@v1
        with:
          api_token: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
          project_key: ${{ env.ORCA_PROJECT_KEY }}
          path: .
          # SARIF lets GitHub render findings in the Security tab.
          format: sarif
          output: orca-sast-results/

      - name: Upload SAST SARIF
        if: always() && hashFiles('orca-sast-results/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: orca-sast-results/
          category: orca-sast

  # -------------------------------------------------------------------
  # SCA: dependency vulns and license issues.
  # -------------------------------------------------------------------
  sca:
    name: SCA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Orca SCA scan
        uses: orcasecurity/shiftleft-fs-action@v1
        with:
          api_token: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
          project_key: ${{ env.ORCA_PROJECT_KEY }}
          path: .
          format: sarif
          output: orca-sca-results/

      - name: Upload SCA SARIF
        if: always() && hashFiles('orca-sca-results/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: orca-sca-results/
          category: orca-sca

  # -------------------------------------------------------------------
  # IaC: Terraform / CloudFormation / Kubernetes / Helm misconfigs.
  # -------------------------------------------------------------------
  iac:
    name: IaC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Orca IaC scan
        uses: orcasecurity/shiftleft-iac-action@v1
        with:
          api_token: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
          project_key: ${{ env.ORCA_PROJECT_KEY }}
          path: .
          format: sarif
          output: orca-iac-results/

      - name: Upload IaC SARIF
        if: always() && hashFiles('orca-iac-results/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: orca-iac-results/
          category: orca-iac

  # -------------------------------------------------------------------
  # IaC (Terragrunt): authenticate to GCP with short-lived credentials via
  # Workload Identity Federation, generate a real terraform plan per module,
  # then scan each plan file with orca-cli.
  #
  # Required secrets:
  #   GCP_WORKLOAD_IDENTITY_PROVIDER  — projects/<n>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
  #   GCP_SERVICE_ACCOUNT             — <sa-name>@<project>.iam.gserviceaccount.com
  #   GCP_PROJECT_ID                  — your GCP project ID
  #
  # The service account needs roles/viewer + roles/iam.securityReviewer
  # (read-only) so plan generation works without modifying real infrastructure.
  # -------------------------------------------------------------------
  iac-terragrunt:
    name: IaC (Terragrunt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Set up Terragrunt
        run: |
          set -euo pipefail
          TG_VERSION="0.55.21"
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Install orca-cli
        run: |
          set -euo pipefail
          curl -sfL 'https://raw.githubusercontent.com/orcasecurity/orca-cli/main/install.sh' \
            | bash -s -- -b /usr/local/bin
          orca-cli --version

      - name: Generate Terragrunt plan files
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p terragrunt-plans

          for module in networking storage database iam; do
            echo "--- Generating plan: $module ---"
            dir="terragrunt/live/dev/$module"

            # Patch project.hcl with the real project ID for this run
            sed -i "s/your-gcp-project-id/${{ secrets.GCP_PROJECT_ID }}/" \
              terragrunt/live/project.hcl

            terragrunt plan \
              --terragrunt-working-dir "$dir" \
              --terragrunt-non-interactive \
              -out="${module}.tfplan" 2>&1

            terragrunt show \
              --terragrunt-working-dir "$dir" \
              -json "${module}.tfplan" \
              > "terragrunt-plans/${module}.tfplan.json"

            echo "Plan generated: terragrunt-plans/${module}.tfplan.json"
          done

      - name: Scan Terragrunt plan files with Orca
        env:
          ORCA_SECURITY_API_TOKEN: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p orca-iac-terragrunt-results

          for plan in terragrunt-plans/*.tfplan.json; do
            module=$(basename "$plan" .tfplan.json)
            echo "Scanning $module..."
            orca-cli --project-key "$ORCA_PROJECT_KEY" iac scan \
              --path "$plan" \
              --format sarif \
              --output "orca-iac-terragrunt-results/${module}.sarif" \
              --no-color || true
          done

      - name: Upload Terragrunt IaC SARIF
        if: always() && hashFiles('orca-iac-terragrunt-results/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: orca-iac-terragrunt-results/
          category: orca-iac-terragrunt

  # -------------------------------------------------------------------
  # Secrets: hardcoded tokens, keys, credentials.
  # -------------------------------------------------------------------
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the scan can see rotated credentials across commits.
          fetch-depth: 0

      - name: Orca Secrets scan
        uses: orcasecurity/shiftleft-secrets-action@v1
        with:
          api_token: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
          project_key: ${{ env.ORCA_PROJECT_KEY }}
          path: .
          format: sarif
          output: orca-secrets-results/

      - name: Upload Secrets SARIF
        if: always() && hashFiles('orca-secrets-results/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: orca-secrets-results/
          category: orca-secrets

  # -------------------------------------------------------------------
  # Container image: build then scan for OS + lang vulns, secrets-in-layers, misconfigs.
  # Dedicated action does not exist for image scan, so we use orca-cli directly.
  # -------------------------------------------------------------------
  image:
    name: Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        working-directory: sample-app
        run: docker build -t "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Install orca-cli
        run: |
          set -euo pipefail
          curl -sfL 'https://raw.githubusercontent.com/orcasecurity/orca-cli/main/install.sh' \
            | bash -s -- -b /usr/local/bin
          orca-cli --version

      - name: Scan image
        env:
          ORCA_SECURITY_API_TOKEN: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
        run: |
          orca-cli --project-key "$ORCA_PROJECT_KEY" image scan \
            "$IMAGE_NAME:$IMAGE_TAG" \
            --format sarif \
            --output orca-image.sarif

      - name: Upload Image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: orca-image.sarif
          category: orca-image

  # -------------------------------------------------------------------
  # Required check: one job to rule them all. Branch protection points here.
  # -------------------------------------------------------------------
  orca-gate:
    name: Orca Gate
    runs-on: ubuntu-latest
    needs: [sast, sca, iac, iac-terragrunt, secrets, image]
    if: always()
    steps:
      - name: Evaluate
        run: |
          set -e
          results='${{ toJson(needs) }}'
          echo "Scan results: $results"
          echo "$results" | grep -q '"result": "failure"' \
            && { echo "::error::Orca policy decision: FAIL. See Security tab for findings."; exit 1; } \
            || echo "Orca policy decision: PASS"
